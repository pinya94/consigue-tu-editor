<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <!-- Duración natural de la animación (la usa el editor al añadirla al timeline) -->
    <meta name="animation-duration" content="4" />
    <style>
      /* El lienzo es del tamaño del proyecto (1920x1080) y el fondo es transparente */
      html,
      body {
        margin: 0;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: transparent;
        font-family: 'Segoe UI', sans-serif;
      }
      .rotulo {
        position: absolute;
        left: 120px;
        bottom: 140px;
        display: flex;
        flex-direction: column;
        gap: 8px;
      }
      .barra {
        height: 8px;
        width: 0;
        background: #22d3c5;
        border-radius: 4px;
        animation: crece 0.6s cubic-bezier(0.2, 0.8, 0.2, 1) 0.1s forwards, crece 0.4s ease-in 3.4s reverse forwards;
      }
      .titulo {
        color: white;
        font-size: 84px;
        font-weight: 800;
        text-shadow: 0 6px 24px rgba(0, 0, 0, 0.5);
        opacity: 0;
        animation: entra 0.7s cubic-bezier(0.2, 0.8, 0.2, 1) 0.3s forwards, sale 0.4s ease-in 3.4s forwards;
      }
      .sub {
        color: #d8dde6;
        font-size: 40px;
        opacity: 0;
        animation: entra 0.7s cubic-bezier(0.2, 0.8, 0.2, 1) 0.5s forwards, sale 0.4s ease-in 3.4s forwards;
      }
      @keyframes crece {
        from { width: 0; }
        to { width: 360px; }
      }
      @keyframes entra {
        from { opacity: 0; transform: translateX(-60px); }
        to { opacity: 1; transform: none; }
      }
      @keyframes sale {
        from { opacity: 1; transform: none; }
        to { opacity: 0; transform: translateY(30px); }
      }
    </style>
  </head>
  <body>
    <div class="rotulo">
      <div class="barra"></div>
      <div class="titulo">Consigue tu editor gratis</div>
      <div class="sub">Animación hecha con HTML y CSS</div>
    </div>
  </body>
</html>
